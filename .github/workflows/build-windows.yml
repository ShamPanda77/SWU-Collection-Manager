name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer les dépendances
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install pyinstaller

      - name: Construire l'application avec PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm SWU_Collection_Manager.spec

      - name: Vérifier l'EXE
        shell: pwsh
        run: |
          Write-Host "Contenu du dossier dist :"
          Get-ChildItem -Path dist -Recurse

      - name: Installer Inno Setup 7
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

            - name: Construire l'installateur
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build\installer" | Out-Null

          Write-Host "Recherche de Inno Setup..."

          $possiblePaths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )

          $iscc = $possiblePaths | Where-Object {
            $_ -and (Test-Path $_)
          } | Select-Object -First 1

          if (-not $iscc) {
            Write-Host "ISCC.exe non trouvé dans les emplacements standards."
            Write-Host "Recherche complémentaire..."

            $found = Get-ChildItem `
              -Path "C:\Program Files", "C:\Program Files (x86)" `
              -Filter "ISCC.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($found) {
              $iscc = $found.FullName
            }
          }

          if (-not $iscc) {
            Write-Error "Impossible de trouver ISCC.exe."
            exit 1
          }

          Write-Host "Inno Setup trouvé : $iscc"
          Write-Host "Création de l'installateur..."

          & $iscc `
            "/Obuild\installer" `
            "installer.iss"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup a échoué avec le code $LASTEXITCODE."
            exit $LASTEXITCODE
          }

      - name: Vérifier l'installateur
        shell: pwsh
        run: |
          Write-Host "Contenu de build\installer :"
          Get-ChildItem -Path "build\installer" -Recurse

      - name: Publier l'installateur comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: SWU-Collection-Manager-Setup
          path: build/installer/SWU_Collection_Manager_Setup.exe
          if-no-files-found: error
